name: catalogue sweep

# Scores the part of the catalogue worth scoring, so it can be curated rather
# than browsed. ~165,000 items at 250 per request, roughly 20 minutes — against
# the 63 minutes a full-catalogue sweep would cost, which is why it is scoped
# to items at or above 100 kr. See docs/handover.md §5.5 for why that floor.

on:
  schedule:
    - cron: "40 5 * * *"   # after the cohort check, so both share a quiet hour
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false   # a half-written sweep is worse than a late one

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The 100 kr floor roughly doubled the sweep to ~660 requests (~20 min), and the
    # outcome resolver runs after it. 45 minutes left too little headroom for a run
    # that hits retries.
    timeout-minutes: 75
    steps:
      # Pinned to commit SHAs, not tags. These jobs hold LOPPAN_SUPABASE_KEY, which
      # is the service_role key and bypasses every RLS policy in the project — a
      # moved tag or a compromised action would hand over the whole database.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Sweep and rescore
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        run: |
          if [ -z "$LOPPAN_SUPABASE_KEY" ]; then
            echo "::error::LOPPAN_SUPABASE_KEY is not set — the sweep would collect nothing."
            exit 1
          fi
          python loppan/sweep.py

      - name: Resolve items that vanished from the shelf
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        # Must run AFTER the sweep: it compares each item's last_seen against the
        # newest sweep date, so running it first would treat the whole catalogue
        # as vanished. Cost is proportional to churn, not to catalogue size —
        # anything the sweep just saw is still listed and needs no request.
        run: python loppan/resolve_outcomes.py
