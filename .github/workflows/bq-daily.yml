name: bq-daily

# Loppan's daily sweep into BigQuery: deploy/bigquery/daily.sh (docs/bigquery.md §5).
#   schedule           daily mode at three slots: 02:23, 04:47 and 07:13 UTC (04:23,
#                      06:47 and 09:13 Stockholm summer time, all the same run date).
#                      Fires only from the default branch. GitHub delays scheduled
#                      runs under load, by 5-9 h so far: the 02:23, 04:47 and 07:13
#                      slots of 2026-10-05 started at 09:15, 11:50 and 16:01 UTC, so a
#                      day's run often lands in the afternoon. Each slot is off the
#                      hour, where delays and drops are worst. The first slot
#                      that fires does the day: daily.sh stamps runs.completed_at as
#                      its last step, and a later slot that finds the stamp exits 0
#                      in seconds. A slot after a failed run finds no stamp and runs
#                      the day again, which is safe: every merge is idempotent. The
#                      concurrency group queues a slot behind a run in progress,
#                      never alongside it.
#   workflow_dispatch  any mode: daily | census (the one-off backfill) | export | origins (the
#                      Circle-origin backlog, in chunks). force reruns a daily that
#                      already completed today (FORCE=1 skips the guard)
#   push               only on the bigquery-daily branch, when this file or daily.sh
#                      changes, in PUSH_MODE: how the pipeline was proven before merge
#
# Runs as loppan-pipeline through Workload Identity Federation, like every bq-* job.
# bq-health.yml checks the next morning that a run happened and passed the gate.

on:
  schedule:
    - cron: "23 2 * * *"
    - cron: "47 4 * * *"
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: daily | census | origins | export
        type: choice
        options: [daily, census, origins, export]
        default: daily
      origins_max:
        description: Circle origins to fetch this run (Parse is serial, ~2 s each)
        default: "1500"
      force:
        description: Run daily even if today's run already completed (FORCE=1)
        type: boolean
        default: false
  push:
    branches: [bigquery-daily]
    paths:
      - .github/workflows/bq-daily.yml
      - deploy/bigquery/daily.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: bq-daily
  cancel-in-progress: false

env:
  PUSH_MODE: export   # the mode a push to bigquery-daily runs
  PUSH_ORIGINS_MAX: "6000"   # ~3.3 h of serial Parse calls, inside the 330 min limit (2nd batch)
  # Marketplace endpoints: public values kept out of the repository so the source
  # does not name the target (loppan/endpoints.py). Repository VARIABLES, not secrets.
  LOPPAN_MARKET_API: ${{ vars.LOPPAN_MARKET_API }}
  LOPPAN_MARKET_GRAPHQL: ${{ vars.LOPPAN_MARKET_GRAPHQL }}
  LOPPAN_MARKET_SITE: ${{ vars.LOPPAN_MARKET_SITE }}
  LOPPAN_MARKET_IMAGE_HOSTS: ${{ vars.LOPPAN_MARKET_IMAGE_HOSTS }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Run
        env:
          MODE: ${{ github.event_name == 'push' && env.PUSH_MODE || inputs.mode || 'daily' }}
          ORIGINS_MAX: ${{ github.event_name == 'push' && env.PUSH_ORIGINS_MAX || inputs.origins_max || '1500' }}
          # Only a dispatch with force ticked sets it; every schedule keeps the guard.
          FORCE: ${{ inputs.force && '1' || '0' }}
          OUT_DIR: ${{ runner.temp }}/bq-run
          # The shortlist export (the last step of daily, and export mode) writes to Supabase.
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        run: |
          mkdir -p "$OUT_DIR"
          bash deploy/bigquery/daily.sh "$MODE"
