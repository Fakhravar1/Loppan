name: bq-debug
# Throwaway: shows the bq CLI's raw output on the runner. Removed in the next commit.
on:
  push:
    branches: [bigquery-daily]
    paths: [.github/workflows/bq-debug.yml]
permissions: {contents: read, id-token: write}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - run: |
          set +e
          echo "== csv scalar"; bq --location=EU --quiet query --use_legacy_sql=false --format=csv 'select count(*) from loppan.kosher_brands' | cat -A | head -5
          echo "== json big max_rows"; bq --location=EU --quiet query --use_legacy_sql=false --format=json --max_rows=100000000 'select brand from loppan.kosher_brands limit 3' 2>&1 | head -c 400; echo " rc=$?"
          echo "== json 10M max_rows"; bq --location=EU --quiet query --use_legacy_sql=false --format=json --max_rows=10000000 'select brand from loppan.kosher_brands limit 3' 2>&1 | head -c 400; echo
          echo "== json full"; bq --location=EU --quiet query --use_legacy_sql=false --format=json --max_rows=10000000 'select brand from loppan.kosher_brands' 2>/dev/null | head -c 200; echo
          echo "== stderr"; bq --location=EU --quiet query --use_legacy_sql=false --format=json --max_rows=10000000 'select brand from loppan.kosher_brands' 2>&1 >/dev/null | head -5
