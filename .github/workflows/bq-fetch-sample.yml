name: bq-fetch-sample

# End-to-end check of the BigQuery fetch path on a tiny live sample: fetch with
# loppan/bq_fetch.py, validate against schema.sql, load into a scratch copy of
# sweep_staging, count, drop. Nothing is written to a real table.
#
# Runs on push only when this file changes. No schedule, no manual trigger.
# Auth is Workload Identity Federation as loppan-pipeline (docs/bigquery.md §9).

on:
  push:
    paths:
      - .github/workflows/bq-fetch-sample.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: bq-fetch-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Offline tests
        run: python3 -m unittest discover tests

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # One category, ~1,900 items at or above the floor. The floor is read from
      # loppan.brand_rules here, since bq is on the path; the summary says which.
      - name: Fetch a census sample
        run: >
          python3 loppan/bq_fetch.py census --categories "Man > Skor > Vardagsskor"
          --out census.ndjson --summary census.json

      - name: Track 200 of those ids, plus two that do not exist
        run: |
          python3 -c "import json; ids=[json.loads(l)['item_id'] for l in open('census.ndjson')][:200]; open('ids.txt','w').write('\n'.join(ids + ['notAnId0001', 'notAnId0002']) + '\n')"
          python3 loppan/bq_fetch.py track --ids ids.txt --out track.ndjson --runs-out runs.ndjson

      - name: Validate against schema.sql
        run: |
          python3 loppan/bq_fetch.py validate census.ndjson --table sweep_staging
          python3 loppan/bq_fetch.py validate track.ndjson --table sweep_staging
          python3 loppan/bq_fetch.py validate runs.ndjson --table runs

      - name: Load into a scratch copy of sweep_staging and count
        run: |
          bq --location=EU query --use_legacy_sql=false \
            'create or replace table loppan._sample_staging like loppan.sweep_staging'
          bq --location=EU load --source_format=NEWLINE_DELIMITED_JSON \
            loppan._sample_staging census.ndjson
          bq --location=EU load --source_format=NEWLINE_DELIMITED_JSON \
            loppan._sample_staging track.ndjson
          bq --location=EU query --use_legacy_sql=false --format=pretty \
            'select source, present, count(*) as n, countif(brand is null) as unbranded,
                    min(price_ore) as min_price_ore, max(fetched_at) as last_fetch
             from loppan._sample_staging group by 1, 2 order by 1, 2'

      - name: Drop the scratch table
        if: always()
        run: bq rm -f -t loppan._sample_staging
