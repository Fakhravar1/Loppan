name: pool sweep

# Sweeps one rotation bucket of brands into the undervalued pool, then refreshes price
# and liveness across the whole pool.
#
# The rotation is what makes the full market affordable. Peer groups at levels 1 and 2
# live entirely inside a brand, so sweeping WHOLE BRANDS holds every usable group
# complete while it is needed, ranks against it, keeps the cheap tail and discards the
# rest. One bucket costs ~146 MB transiently instead of ~558 MB permanently, and the
# groups are complete rather than sampled. See docs/analytics.md §9.
#
# Buckets are crc32(brand) % BUCKETS and each run asks the data which bucket has gone
# longest unswept, so the rotation covers the market and self-corrects after a failure.
# `pool_refresh` runs on a subset of those runs regardless of which bucket was swept,
# because price and still_listed go stale far faster than the peer median does.
#
# ⚠️ The minute is 23 rather than 00. GitHub delays `schedule` events under load and
# drops them when the backlog is bad, and the top of the hour is the worst slot.
# `enrol` sat at `0 6` from 2026-08-07 and never fired once. Do not round this off.
#
# Ordering against the other jobs: this needs `brand_daily` for the per-brand columns,
# which `track` writes via analytics.py at 04:30. It does NOT need `items` or
# `peer_prices` — it computes its own peer groups from the sweep — so a day when track
# does not run costs only slightly staler brand aggregates, not a broken pass.

on:
  # Paused 2026-08-17 12:0xZ, resumed 2026-08-17 12:5xZ. Kept as a record because the
  # sixth outage cost real money and did not look like the five before it.
  #
  # qvitta-pi's runner stopped mid-sweep on 08-14 and `route` fell back to hosted, as
  # designed -- but this is a PRIVATE repo, so hosted bills, and the fallback ran at the
  # Pi's full 12-a-day cadence. 522 of the 834 hosted minutes spent 08-04..17 were this
  # workflow: ~150 min/day (142 on the 15th, 159 on the 16th) against a 2,000 min/month
  # pool shared with every repo on the account. The cost gate now in `route` is the
  # standing fix; this pause was only to stop the bleed while the Pi was diagnosed.
  #
  # ⚠️ Two claims made during that diagnosis were wrong, and the corrections are the
  # useful part:
  #
  #   - "The Pi stopped serving jobs at 08-14T11:12Z" is false. That job never ran: its
  #     `runner_name` is empty and it was cancelled at 08-15T11:14Z, 24 h 2 min after
  #     being queued -- the exact trap the `route` comment below describes. The Pi's last
  #     real work was the sweep that began 08-14T09:31:08Z and never logged a completion.
  #
  #   - It was not the SD fault from crashes 4 and 5. dmesg had ZERO `I/O error` and zero
  #     `Got data interrupt`, and `exit code 135` was 0 in every _diag log except 08-13's.
  #     The service simply went silent mid-job for three days: no error, no SIGBUS, no
  #     listener relaunch. `systemctl restart` brought it straight back. Cause unknown --
  #     do not reach for the SD card next time without checking dmesg first.
  #
  # Resumed because the runner is online and the gate makes a re-failure cheap: `route`
  # re-probes every run, so if the Pi goes quiet again the fallback is four 6-hourly
  # slots (~40 min/day), not twelve.
  schedule:
    # Every two hours. 24 buckets at 12 runs a day is a two-day rotation, so nothing in
    # the pool is more than two days old -- faster than the three days that 12 buckets
    # at 4 runs gave, and each run stages half as much, which is what keeps peak RSS
    # under the cgroup ceiling. See docs/pi-runner.md.
    #
    # Spread rather than bunched: a run is ~8 min and holds its bucket in
    # `sweep_staging` while it works, so overlapping two would double the transient
    # storage for no benefit. `concurrency` below is the real guard; the spacing just
    # means it never has to fire.
    #
    # ⚠️ The minute stays 23 for the reason recorded above -- do not round these to the
    # hour. Runs landing before track (04:30) and enrol (06:17 / 06:43) use the previous
    # day's `brand_daily`; `refresh_pool_bucket` takes `max(as_of) where as_of <= today`,
    # so that is slightly staler brand aggregates, not a broken pass.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      bucket:
        description: Bucket to sweep (blank = the one today's date selects)
        type: string
        required: false
      trace:
        description: Report top allocation sites (tracemalloc — roughly doubles runtime)
        type: boolean
        required: false
        default: false

concurrency:
  group: pool
  cancel-in-progress: false   # a half-swept bucket is worse than a late one

jobs:
  # Same probe as `track`: a job sent to an offline self-hosted runner does not fail,
  # it QUEUES silently for up to 24 h and is then cancelled, and `timeout-minutes`
  # does not catch it because a queued job has no execution time. See docs/pi-runner.md.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      sweep: ${{ steps.pick.outputs.sweep }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          # One `runner` variable decided here and emitted once at the end, rather than a
          # write-and-exit per branch. The cost gate below has to see the answer, and an
          # early `exit 0` in the no-token branch used to skip everything after it.
          runner=ubuntu-latest
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RUNNER_STATUS_TOKEN is not set — routing to hosted."
          else
            ready=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
              --jq '[.runners[]
                     | select(any(.labels[]; .name == "qvitta-pi"))
                     | select(.status == "online" and .busy == false)] | length' \
              2>/dev/null || echo "probe-failed")
            if [ "$ready" = "probe-failed" ]; then
              echo "::warning::Could not read runner status — routing to hosted."
            elif [ "$ready" -ge 1 ]; then
              echo "qvitta-pi is online and idle — routing there (unbilled, and behind the VPN)."
              runner=qvitta-pi
            else
              echo "::warning::qvitta-pi is offline or busy — routing to hosted."
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          # Cost gate. On the Pi a sweep is unbilled, so it runs at full cadence. Routed
          # hosted it is not, and the full cadence does not fit the budget:
          #
          #   12 runs/day x 7.0 min (measured mean over 9 passes) = 84 min/day
          #                                                       ~ 2,520 min/month
          #   free pool, shared across every repo on the account  = 2,000 min/month
          #
          # -- and that is before track (~400), cohort (~45) and enrol (~45). So a
          # fallback that was meant to keep the pool fresh during an outage would quietly
          # spend the sibling's minutes too, and the longer the Pi is down the worse it
          # gets. Hosted runs are therefore cut to the four 6-hourly slots, which is the
          # cadence pool_refresh already uses and which keeps the rotation moving at a
          # third of the cost.
          #
          # workflow_dispatch is never gated: a human asking for a sweep gets a sweep.
          h=$(date -u +%H)
          if [ "$runner" = "qvitta-pi" ] \
             || [ "${{ github.event_name }}" != "schedule" ] \
             || [ $((10#$h % 6)) -eq 0 ]; then
            echo "sweep=true" >> "$GITHUB_OUTPUT"
          else
            echo "sweep=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Routed hosted and hour ${h} UTC is not a 6-hourly slot — skipping this sweep to protect the shared free-minutes pool. Sweeps run at 00/06/12/18 while the Pi is down."
          fi

  sweep:
    needs: route
    # Gated at the JOB level, not the step level, so a skipped sweep costs nothing at
    # all -- no runner allocation, no checkout. See the cost gate in `route`.
    if: needs.route.outputs.sweep == 'true'
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 120
    steps:
      # SHA-pinned: this job holds the service_role key, which bypasses all RLS.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Skipped on the Pi, which carries its own 3.12 and has no tool cache — see
      # docs/pi-runner.md. Both paths are invoked as `python3`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      # Decided BEFORE the sweep so the answer exists even if the sweep dies -- the
      # refresh below runs on `always()` and would otherwise have nothing to read.
      - name: Decide whether to refresh the whole pool
        id: gate
        run: |
          # pool_refresh reads the ENTIRE pool, not just the bucket that was swept, so
          # its cost scales with how often this workflow runs rather than with bucket
          # size. The sweep went to 12 runs a day; the refresh stays at 4, which is what
          # it was when the workflow ran 4 times a day. Prices are no staler than before,
          # and the extra sweep frequency is close to free.
          #
          # Crons fire on even hours, so hours divisible by 6 are 00, 06, 12 and 18.
          # 10# forces base 10: "08" and "09" are invalid octal and would error.
          h=$(date -u +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((10#$h % 6)) -eq 0 ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing the whole pool on this run (hour ${h} UTC)."
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sweep only — the whole-pool refresh runs at 00/06/12/18 UTC."
          fi

      - name: Sweep this rotation bucket
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
          BUCKET: ${{ inputs.bucket }}
          LOPPAN_TRACEMALLOC: ${{ inputs.trace && '1' || '0' }}
          # No MALLOC_ARENA_MAX here, deliberately. It was tried on 2026-08-11 and did
          # nothing -- bucket 7 peaked at 264 MB with it, the same as without -- and the
          # test was badly chosen anyway: this path is single-threaded, so glibc uses the
          # main arena regardless and the arena cap could never have applied. The real
          # fix was connection reuse in algolia._post. Left as a comment so nobody adds
          # it back as a plausible-looking tuning knob.
        run: |
          if [ -z "$LOPPAN_SUPABASE_KEY" ]; then
            echo "::error::LOPPAN_SUPABASE_KEY is not set — nothing could be written."
            exit 1
          fi
          # Under `time -v` permanently, for the same reason track.py is: the peak RSS
          # has to be in the log of every pass, or nobody notices it climbing until the
          # box is on the floor. That is exactly how 2026-08-10 happened -- this job
          # was never measured, and it outgrew a cgroup cap sized for track.py.
          # See docs/pi-runner.md, "The second livelock".
          if [ -n "${BUCKET:-}" ]; then
            /usr/bin/time -v python3 -u loppan/sweep_pool.py --bucket "$BUCKET"
          else
            /usr/bin/time -v python3 -u loppan/sweep_pool.py
          fi

      # Runs even if the sweep failed: the pool still holds every other bucket, whose
      # prices and liveness are worth keeping current, and a stale price is a worse
      # lie than a missing bucket.
      - name: Refresh price and liveness across the whole pool
        if: always() && steps.gate.outputs.refresh == 'true'
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        run: /usr/bin/time -v python3 -u loppan/pool_refresh.py
