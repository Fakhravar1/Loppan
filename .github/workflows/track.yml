name: track enrolled items

# Follows the enrolled sample to its outcome. Replaces the Typesense sweep, which
# read a ~5% subset of the market and has been removed.
#
# Daily. Weekly is enough for outcomes alone, but four things only exist at higher
# resolution and Parse cannot supply any of them: likes gathered in an item's first
# week, items that sell within days of listing, sales that follow shortly after a
# markdown, and listing inflow (which sets how crowded the shelf is). Favourites in
# particular exist ONLY in Algolia.
#
# Measured cost: ~66 min per full pass over 666k items, so ~1,980 of the 2,000 free
# GitHub Actions minutes per month. That is too tight to leave as-is — see the note
# in the run step.

on:
  schedule:
    - cron: "30 4 * * *"   # daily, before the cohort check
  workflow_dispatch:

concurrency:
  group: track
  cancel-in-progress: false   # a half-written pass is worse than a late one

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # SHA-pinned: this job holds the service_role key, which bypasses all RLS.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check enrolled items and adjudicate disappearances
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        run: |
          if [ -z "$LOPPAN_SUPABASE_KEY" ]; then
            echo "::error::LOPPAN_SUPABASE_KEY is not set — nothing could be written."
            exit 1
          fi
          python loppan/track.py
