name: track enrolled items

# Follows the enrolled sample to its outcome. Replaces the Typesense sweep, which
# read a ~5% subset of the market and has been removed.
#
# Every other day. Weekly is enough for outcomes alone, but four things need finer
# resolution and Parse cannot supply any of them: likes gathered in an item's first
# week, items that sell within days of listing, sales following shortly after a
# markdown, and listing inflow. Favourites exist ONLY in Algolia.
#
# Cadence was originally a budget decision, from a ~66 min estimate for a full pass:
# daily would have been ~1,980 of the 2,000 free minutes per month, every other day
# ~990. Both figures were wrong. Timed 2026-08-08 over the real 668,961 items, a
# pass is 26.8 min — ~400 min/month at this cadence, and daily would be ~810.
#
# So the budget no longer forces every other day. Keep it anyway: it resolves a sale
# to within two days against a ~60-day median time to sell, and the spare minutes
# are worth more to the other repos sharing this account's allowance. If sale-date
# precision ever becomes the binding constraint, daily is affordable now — that is a
# data decision, not a cost one.
#
# 2026-08-08: an attempt to move this job to the qvitta-pi self-hosted runner
# (unbilled minutes) was REVERTED the same night, when the very first pass wedged
# the 1 GB Pi into a swap-thrash livelock 14 min in.
#
# The memory was then measured, and the diagnosis in the revert was wrong in the
# direction that mattered: the pass peaked at ~7.3 GB, so it did not comfortably
# fit the hosted runners either — this repo is private, so ubuntu-latest is the
# 7 GB runner. The pass is now paged and its Algolia reads windowed: 84 MB peak
# over the full sample, flat as it grows. See docs/pi-runner.md.
#
# Where a pass runs is now decided by the `route` job below rather than hardcoded,
# and the Loppan runner service on the Pi is cgroup-capped (MemoryMax plus
# MemorySwapMax=0 — swap thrash, not OOM, is what killed the box, and a memory cap
# alone would not have stopped it). An overrun there is now a failed job that the
# next run resumes from its checkpoint, not a wedged machine.
#
# NOTE: */2 matches odd days of the month, so gaps are 2 days except at month
# boundaries (31st -> 1st is consecutive; 29th -> 1st in a 30-day month is 3 days).
# Sale-date precision therefore varies by a day either way, which is immaterial
# against a ~60-day median time to sell.

on:
  schedule:
    - cron: "30 4 */2 * *"   # every other day, before the cohort check
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to use (auto = qvitta-pi if it is online, else hosted)
        type: choice
        default: auto
        options: [auto, ubuntu-latest, qvitta-pi]

concurrency:
  group: track
  cancel-in-progress: false   # a half-written pass is worse than a late one

jobs:
  route:
    # Decides where the pass runs, because GitHub will not decide sensibly on its
    # own: a job sent to an offline self-hosted runner does not fail, it QUEUES —
    # silently, for up to 24 h, and is then cancelled. `timeout-minutes` does not
    # catch it either, since that counts execution time and a queued job has none.
    # Before this job existed, a dead Pi meant a silently skipped pass.
    #
    # Costs a few seconds of billed time per run, which is the point: it is cheap
    # to ask, and expensive to assume.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          # Listing self-hosted runners needs administration:read, which the default
          # GITHUB_TOKEN cannot be granted. Without RUNNER_STATUS_TOKEN the probe
          # cannot answer, and an unanswerable probe routes hosted — loudly. See
          # docs/pi-runner.md for creating the token.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          CHOICE: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          if [ -n "${CHOICE:-}" ] && [ "${CHOICE}" != "auto" ]; then
            echo "runner=${CHOICE}" >> "$GITHUB_OUTPUT"
            echo "Runner pinned by dispatch input: ${CHOICE}"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RUNNER_STATUS_TOKEN is not set — cannot tell whether qvitta-pi is online, so routing to hosted. The pass still runs; it just costs billed minutes."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '[.runners[]
                   | select(any(.labels[]; .name == "qvitta-pi"))
                   | select(.status == "online" and .busy == false)] | length' \
            2>/dev/null || echo "probe-failed")
          if [ "$ready" = "probe-failed" ]; then
            echo "::warning::Could not read runner status (token scope or API error) — routing to hosted."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          elif [ "$ready" -ge 1 ]; then
            echo "qvitta-pi is online and idle — routing there (unbilled)."
            echo "runner=qvitta-pi" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::qvitta-pi is offline or busy — routing to hosted so the pass still happens."
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  # Same guard as pool.yml, for the same failure and the same reason — see the long
  # note there. Short version: `route` can only tell you the Pi was alive a moment ago.
  # If it dies between the probe and the dispatch, the job below does not fail, it sits
  # `queued` for 24 h holding the `track` concurrency group, and nothing goes red.
  #
  # It costs more here than it does for the pool. The pool sweeps twelve times a day
  # and its rotation self-corrects; `track` runs every other day, so one wedged run is
  # a lost pass and a two-day hole in the price history. Hence the re-dispatch rather
  # than just a cancel.
  watchdog:
    needs: route
    if: needs.route.outputs.runner != 'ubuntu-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write   # cancel this run, and re-dispatch it pinned to hosted
    steps:
      - name: Cancel and re-route if the Pi never picks the job up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '[.jobs[] | select(.name == "track")] | first | .status // "unknown"' \
              2>/dev/null || echo "unknown")
            case "$state" in
              in_progress|completed)
                echo "track is ${state} — qvitta-pi took the job. Nothing to do."
                exit 0
                ;;
            esac
            sleep 30
          done
          echo "::error::track sat queued for 10 minutes — qvitta-pi accepted the dispatch and then went away. Cancelling so the 'track' concurrency group is not held for 24 h, and re-dispatching pinned to hosted."
          # Dispatch first: the cancel below kills this job too. Pinning the runner is
          # what stops the new run from re-arming this watchdog and looping.
          gh workflow run track.yml --ref "${GITHUB_REF_NAME}" \
            -f runner=ubuntu-latest \
            || echo "::warning::Re-dispatch failed — cancelling anyway. The pass resumes from its checkpoint on the next scheduled run."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"

  track:
    needs: route
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 300
    steps:
      # SHA-pinned: this job holds the service_role key, which bypasses all RLS.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Skipped on the Pi: setup-python has no dependable prebuilt for Ubuntu 24.04
      # arm64 and there is no tool cache on that box, so it would try to build from
      # source. The Pi already carries the matching interpreter system-wide (3.12.3).
      # Both paths are invoked as `python3`, which setup-python also provides.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Report the interpreter actually in use
        run: python3 -VV
      - name: Check enrolled items and adjudicate disappearances
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        # Run under `time -v` so "Maximum resident set size" lands in the log of every
        # pass. This job quietly grew to a ~7.3 GB peak against a 7 GB runner without
        # ever failing loudly, because nothing reported the number. It is now paged and
        # should sit near 350 MB; if that figure starts climbing, something began
        # accumulating across pages again.
        run: |
          if [ -z "$LOPPAN_SUPABASE_KEY" ]; then
            echo "::error::LOPPAN_SUPABASE_KEY is not set — nothing could be written."
            exit 1
          fi
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v python3 loppan/track.py
          else
            python3 loppan/track.py
          fi

      - name: Rebuild the analytics layer
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        # Peer prices, the predictor leaderboard and the brand snapshot, in that
        # order — see loppan/analytics.py for why the order is load-bearing.
        #
        # Must run AFTER the sweep, for two separate reasons. Peer groups are built
        # from live items at their current prices, so refreshing first would rank
        # against yesterday's shelf. And the peer freeze reads the outcomes track.py
        # has just written, so running first would freeze nothing.
        #
        # ~1 min 45 s for 669k items, against a ~27 min pass. Not gated on the sweep
        # succeeding in full: a resumed or partial pass still leaves the shelf in a
        # readable state, and a day with no analytics row is harder to spot later
        # than one whose row is merely built on fewer observations.
        run: python3 loppan/analytics.py

      - name: Rebuild the undervalued shortlist
        env:
          LOPPAN_SUPABASE_KEY: ${{ secrets.LOPPAN_SUPABASE_KEY }}
        # Last, because it reads what both steps above write: peer_prices for the
        # ranking and brand_daily for the per-brand columns. Running it earlier would
        # rank against yesterday's shelf, which is the same trap the analytics order
        # exists to avoid.
        #
        # The only step here that talks to Algolia, and it does so for ~500 items —
        # about five requests — to attach the pictures the dashboard shows. Images
        # live nowhere in the database; see loppan/shortlist.py for why.
        #
        # Deliberately not `continue-on-error`: unlike the analytics layer, a missing
        # shortlist is immediately visible as an empty grid, so a loud failure costs
        # nothing and a quiet one would leave yesterday's picks looking like today's.
        #
        # ⚠️ DISABLED 2026-08-11. This step DESTROYS THE POOL. `refresh_shortlist()`
        # predates the bucket rotation, knows nothing about `bucket`, and clears
        # `shortlist_daily` wholesale — so running it wipes every bucketed row that
        # `pool.yml`'s twelve daily sweeps built and resets the rotation to bucket 0.
        # Observed exactly that on 2026-08-11: 8 covered buckets and ~78,000 rows gone,
        # replaced by 37,010 rows with no bucket at all.
        #
        # It had been silently skipped since 08-10 because `analytics.py` always failed
        # ahead of it, which is the only reason the collision never showed. Fixing
        # analytics un-skipped it, and it ran.
        #
        # Two systems now claim `shortlist_daily` and only one can own it. The pool is
        # the live design — `sweep_pool.py` + `refresh_pool_bucket()`, twelve runs a day,
        # bucket-aware, and what docs/analytics.md §9 describes. `shortlist.py` is the
        # pre-pool path. Re-enable it only after `refresh_shortlist()` is either retired
        # or taught about buckets; the README's "must stay there" predates the pool.
        if: false
        run: python3 loppan/shortlist.py
