# Drop-in for actions.runner.Fakhravar1-Loppan.qvitta-pi.service
#
# Puts the Loppan runner -- and therefore every step of every Loppan workflow job --
# inside the `loppan` namespace, so all of its traffic leaves through the tunnel.
# The Qvitta runner is a separate unit and is not touched by this file.
#
# Requires= rather than Wants=: if the namespace cannot be built, the runner must not
# start at all. A runner that starts anyway would come up in the host namespace and
# crawl from the home IP, which is the exact thing this exists to prevent.
[Unit]
Requires=loppan-netns.service
After=loppan-netns.service

[Service]
NetworkNamespacePath=/run/netns/loppan
